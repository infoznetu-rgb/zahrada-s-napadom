<script>
(function(){
  var p=location.pathname.replace(/\/+/g,'/');
  var m=p.match(/^\/(blog|napady)\/([^/]+)\/?$/);
  if(m){
    location.replace('/'+m[1]+'/'+m[2]+'/index.html'+location.search+location.hash);
    return;
  }
})();
</script>
