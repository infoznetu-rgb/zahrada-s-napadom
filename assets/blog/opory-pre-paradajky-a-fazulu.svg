<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d"><title id="t">Opory pre paradajky a fazuľu z konárov</title><desc id="d">Schéma trojnožky a zvislých opôr z rovných konárov, upevnených v pôde a zviazaných motúzom.</desc><defs><linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f3f7e9"/><stop offset="1" stop-color="#e8dec7"/></linearGradient><style>text{font-family:Arial,sans-serif;fill:#29452f}.h{font-size:62px;font-weight:700}.s{font-size:30px}.lab{font-size:33px;font-weight:700}.stick{stroke:#7b5b3d;stroke-width:22;stroke-linecap:round}.vine{stroke:#5e8f56;stroke-width:13;fill:none}.line{stroke:#315b3a;stroke-width:5;fill:none}</style></defs><rect width="1600" height="1000" fill="url(#b)"/><text x="85" y="105" class="h">Opory z konárov</text><text x="85" y="160" class="s">Pevné zapichnutie, hladké hrany a viazanie, ktoré neškrtí stonku.</text><path d="M530 780 L670 250 M790 780 L670 250 M670 780 L670 250" class="stick"/><path d="M630 300 Q670 330 715 300" stroke="#c09a5d" stroke-width="14" fill="none"/><path d="M660 750 C560 680 745 620 650 550 C560 480 760 410 675 345" class="vine"/><circle cx="620" cy="620" r="35" fill="#c94f45"/><circle cx="710" cy="500" r="35" fill="#c94f45"/><path d="M1050 380 H810 L730 320" class="line"/><text x="1060" y="360" class="lab">Zviazať pevne</text><text x="1050" y="400" class="s">vrch opory, nie stonku rastliny</text><path d="M290 690 H510" class="line"/><text x="85" y="670" class="lab">Zapichnúť hlbšie</text><text x="85" y="710" class="s">opora sa nemá kývať vo vetre</text><text x="85" y="950" class="s">Záhrada s nápadom · praktická ilustračná schéma</text></svg>