<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d">
<title id="t">Ručné náradie na jednej stene</title><desc id="d">Schéma dielenskej steny s bezpečne zaveseným ručným náradím, pracovnou výškou, oddelenými ostrými nástrojmi a voľným priechodom.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f2f5e9"/><stop offset="1" stop-color="#eadfc8"/></linearGradient><style>text{font-family:Arial,sans-serif;fill:#29452f}.h{font-size:62px;font-weight:700}.s{font-size:30px}.lab{font-size:33px;font-weight:700}.line{stroke:#315b3a;stroke-width:5;fill:none}.board{fill:#c69d6d;stroke:#76583a;stroke-width:8}.metal{fill:#6c7270}</style></defs>
<rect width="1600" height="1000" fill="url(#bg)"/><text x="85" y="105" class="h">Ručné náradie na jednej stene</text><text x="85" y="160" class="s">Najčastejšie používané veci do pracovnej výšky, ostré nástroje mimo náhodného dotyku.</text>
<rect x="420" y="240" width="700" height="590" rx="16" class="board"/>
<g stroke="#6d5437" stroke-width="4" opacity=".45"><path d="M470 300 H1070"/><path d="M470 358 H1070"/><path d="M470 416 H1070"/><path d="M470 474 H1070"/><path d="M470 532 H1070"/><path d="M470 590 H1070"/><path d="M470 648 H1070"/><path d="M470 706 H1070"/><path d="M470 764 H1070"/></g>
<!-- hammer --><path d="M585 400 V650" stroke="#72543b" stroke-width="24" stroke-linecap="round"/><rect x="520" y="345" width="130" height="55" rx="12" class="metal"/>
<!-- pliers --><path d="M770 430 L735 620 M770 430 L810 620" stroke="#5e6462" stroke-width="20" stroke-linecap="round"/><circle cx="770" cy="430" r="28" fill="#4e5452"/>
<!-- shears --><path d="M940 420 L890 600 M940 420 L995 600" stroke="#657266" stroke-width="20"/><circle cx="940" cy="420" r="26" fill="#4b544c"/>
<!-- hooks --><path d="M560 320 q0 45 35 45" fill="none" stroke="#4d5550" stroke-width="12"/><path d="M750 320 q0 45 35 45" fill="none" stroke="#4d5550" stroke-width="12"/><path d="M920 320 q0 45 35 45" fill="none" stroke="#4d5550" stroke-width="12"/>
<path d="M315 360 H420" class="line"/><text x="85" y="340" class="lab">Pracovná výška</text><text x="85" y="380" class="s">najčastejšie náradie približne medzi pásom a ramenami</text>
<path d="M1120 500 H1290" class="line"/><text x="1190" y="480" class="lab">Pevné háky</text><text x="1180" y="520" class="s">kotvenie musí zodpovedať stene aj hmotnosti</text>
<path d="M1115 685 H1300" class="line"/><text x="1160" y="665" class="lab">Ostré nástroje</text><text x="1150" y="705" class="s">mimo priechodu a detského dosahu</text>
<text x="85" y="935" class="lab">Priechod pod stenou nechaj voľný</text><text x="85" y="975" class="s">Záhrada s nápadom · praktická dielenská schéma</text></svg>