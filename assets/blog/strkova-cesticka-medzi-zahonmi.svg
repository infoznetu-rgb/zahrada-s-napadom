<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d"><title id="t">Štrková cestička medzi záhonmi</title><desc id="d">Rez štrkovou cestičkou s obrubou, zhutneným podkladom, nosnou vrstvou a vrchným štrkom.</desc><defs><linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f3f6e9"/><stop offset="1" stop-color="#eadfc6"/></linearGradient><style>text{font-family:Arial,sans-serif;fill:#29452f}.h{font-size:62px;font-weight:700}.s{font-size:30px}.lab{font-size:33px;font-weight:700}.line{stroke:#315b3a;stroke-width:5;fill:none}</style></defs><rect width="1600" height="1000" fill="url(#b)"/><text x="85" y="105" class="h">Štrková cestička medzi záhonmi</text><text x="85" y="160" class="s">Pevná obruba a zhutnený podklad držia štrk na mieste lepšie než hrubá vrstva voľného kameňa.</text><rect x="250" y="350" width="1100" height="380" fill="#7f694f"/><rect x="300" y="390" width="1000" height="160" fill="#9c9482"/><rect x="300" y="330" width="1000" height="75" fill="#c8c0aa"/><g fill="#8f8b80"><circle cx="390" cy="365" r="22"/><circle cx="460" cy="350" r="19"/><circle cx="540" cy="368" r="23"/><circle cx="630" cy="350" r="20"/><circle cx="720" cy="370" r="22"/><circle cx="810" cy="350" r="20"/><circle cx="900" cy="367" r="23"/><circle cx="1000" cy="350" r="21"/><circle cx="1100" cy="368" r="23"/><circle cx="1200" cy="350" r="20"/></g><rect x="260" y="315" width="35" height="270" fill="#6d5a43"/><rect x="1305" y="315" width="35" height="270" fill="#6d5a43"/><path d="M180 360 H300" class="line"/><text x="85" y="335" class="lab">Vrchný štrk</text><text x="85" y="375" class="s">tenšia pochôdzna vrstva</text><path d="M1400 470 H1300" class="line"/><text x="1180" y="445" class="lab">Obruba</text><text x="1160" y="485" class="s">bráni rozsýpaniu do záhona</text><path d="M190 570 H300" class="line"/><text x="85" y="545" class="lab">Zhutnený podklad</text><text x="85" y="585" class="s">rozhoduje o stabilite</text><text x="85" y="950" class="s">Záhrada s nápadom · praktická ilustračná schéma</text></svg>