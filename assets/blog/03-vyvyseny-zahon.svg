<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d"><title id="t">Vyvýšený záhon</title><desc id="d">Rez vyvýšeným záhonom s pevnou konštrukciou, pestovateľskou vrstvou a pôdou pod záhonom.</desc><defs><linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f3f7e9"/><stop offset="1" stop-color="#e8dec7"/></linearGradient><style>text{font-family:Arial,sans-serif;fill:#29452f}.h{font-size:66px;font-weight:700}.s{font-size:31px}.lab{font-size:40px;font-weight:700}</style></defs><rect width="1600" height="1000" fill="url(#b)"/><circle cx="1320" cy="170" r="110" fill="#e8c76a" opacity=".55"/><path d="M0 700 C300 620 600 750 900 680 S1300 630 1600 700 V1000 H0Z" fill="#79975c"/><rect x="330" y="360" width="940" height="330" rx="45" fill="#8a6a49"/><rect x="390" y="410" width="820" height="220" rx="35" fill="#5e4735"/><g fill="#86a166"><circle cx="520" cy="430" r="75"/><circle cx="730" cy="390" r="90"/><circle cx="950" cy="440" r="78"/><circle cx="1110" cy="400" r="65"/></g><text x="85" y="120" class="h">Vyvýšený záhon</text><text x="85" y="190" class="s">Rez vyvýšeným záhonom s pevnou konštrukciou, pestovateľskou vrstvou a pôdou pod záhonom.</text><text x="85" y="825" class="lab">Pevný rám a kvalitná koreňová zóna</text><text x="85" y="875" class="s">výplň prispôsobiť hĺbke a plodinám</text><text x="85" y="955" class="s">Záhrada s nápadom · praktická ilustračná schéma</text></svg>