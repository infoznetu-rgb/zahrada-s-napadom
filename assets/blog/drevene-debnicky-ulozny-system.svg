<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d">
<title id="t">Drevené debničky ako úložný systém</title><desc id="d">Praktická schéma troch drevených debničiek spojených do stabilného úložného systému s ťažšími vecami dole, kotvením a voľným priechodom.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f3f6e9"/><stop offset="1" stop-color="#e8ddc4"/></linearGradient><style>text{font-family:Arial,sans-serif;fill:#29452f}.h{font-size:62px;font-weight:700}.s{font-size:30px}.lab{font-size:33px;font-weight:700}.wood{fill:#a97950;stroke:#694830;stroke-width:8}.line{stroke:#315b3a;stroke-width:5;fill:none}</style></defs>
<rect width="1600" height="1000" fill="url(#bg)"/><text x="85" y="105" class="h">Drevené debničky ako úložný systém</text><text x="85" y="160" class="s">Pevnosť, kotvenie a správne rozloženie hmotnosti sú dôležitejšie než vzhľad.</text>
<rect x="500" y="250" width="470" height="190" rx="14" class="wood"/><rect x="500" y="460" width="470" height="190" rx="14" class="wood"/><rect x="500" y="670" width="470" height="190" rx="14" class="wood"/>
<g fill="#d6b990"><rect x="540" y="285" width="390" height="28"/><rect x="540" y="340" width="390" height="28"/><rect x="540" y="495" width="390" height="28"/><rect x="540" y="550" width="390" height="28"/><rect x="540" y="705" width="390" height="28"/><rect x="540" y="760" width="390" height="28"/></g>
<circle cx="610" cy="805" r="45" fill="#6b725d"/><rect x="710" y="760" width="150" height="70" rx="12" fill="#6e7d64"/>
<rect x="590" y="540" width="100" height="55" rx="8" fill="#d7cfb0"/><circle cx="825" cy="560" r="34" fill="#8a9b67"/>
<path d="M970 345 H1120" class="line"/><text x="1140" y="335" class="lab">Spojiť / ukotviť</text><text x="1130" y="375" class="s">pri vyššom stohovaní</text>
<path d="M420 810 H500" class="line"/><text x="85" y="790" class="lab">Ťažšie veci dole</text><text x="85" y="830" class="s">nižšie ťažisko = menšie riziko prevrátenia</text>
<path d="M340 520 H500" class="line"/><text x="85" y="500" class="lab">Hladké hrany</text><text x="85" y="540" class="s">triesky, klince a spony odstrániť</text>
<path d="M1050 800 H1250" class="line"/><text x="1070" y="780" class="lab">Voľný priechod</text><text x="1060" y="820" class="s">debničky nesmú zavadzať pri dverách</text>
<text x="85" y="960" class="s">Záhrada s nápadom · praktická ilustračná schéma</text></svg>