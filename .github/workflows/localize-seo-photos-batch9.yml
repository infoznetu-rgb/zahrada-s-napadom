name: Localize SEO photos batch 9
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localize-seo-photos-batch9.yml'
permissions:
  contents: write
jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download lawn photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/blog/seo-specific
          curl -L --fail --retry 3 'https://images.pexels.com/photos/36551708/pexels-photo-36551708.jpeg?auto=compress&cs=tinysrgb&w=1280&h=720&fit=crop' -o assets/blog/seo-specific/polievanie-travnika.jpg
          curl -L --fail --retry 3 'https://images.pexels.com/photos/1049771/pexels-photo-1049771.jpeg?auto=compress&cs=tinysrgb&w=1280&h=720&fit=crop' -o assets/blog/seo-specific/mach-v-travniku.jpg
          curl -L --fail --retry 3 'https://images.pexels.com/photos/29290265/pexels-photo-29290265.jpeg?auto=compress&cs=tinysrgb&w=1280&h=720&fit=crop' -o assets/blog/seo-specific/hole-miesta-travnik.jpg
          curl -L --fail --retry 3 'https://images.pexels.com/photos/8116107/pexels-photo-8116107.jpeg?auto=compress&cs=tinysrgb&w=1280&h=720&fit=crop' -o assets/blog/seo-specific/vertikutacia.jpg
      - name: Update article image references
        shell: python
        run: |
          import json,re
          from pathlib import Path
          items={
            "polievanie-travnika":"/assets/blog/seo-specific/polievanie-travnika.jpg",
            "mach-v-travniku-priciny":"/assets/blog/seo-specific/mach-v-travniku.jpg",
            "hole-miesta-v-travniku-dosievanie":"/assets/blog/seo-specific/hole-miesta-travnik.jpg",
            "vertikutacia-travnika-kedy":"/assets/blog/seo-specific/vertikutacia.jpg",
          }
          for slug,new in items.items():
            p=Path("blog")/slug/"index.html"
            s=p.read_text()
            s=re.sub(r'(<meta property="og:image" content=")[^"]+(")',lambda m:m.group(1)+"https://zahradasnapadom.sk"+new+m.group(2),s)
            s=re.sub(r'(<meta name="twitter:image" content=")[^"]+(")',lambda m:m.group(1)+"https://zahradasnapadom.sk"+new+m.group(2),s)
            s=re.sub(r'("image":\["https://zahradasnapadom\.sk)[^"]+("\])',lambda m:m.group(1)+new+m.group(2),s)
            s=re.sub(r'(<figure class="post-hero"><img src=")[^"]+(")',lambda m:m.group(1)+new+m.group(2),s)
            s=re.sub(r'("cover_url":\s*")[^"]+(")',lambda m:m.group(1)+new+m.group(2),s)
            p.write_text(s)
          j=Path("data/seo-blog-100-list.json")
          data=json.loads(j.read_text())
          for row in data:
            if row.get("slug") in items:
              row["cover_url"]=items[row["slug"]]
          j.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n")
      - name: Commit local lawn photos
        shell: bash
        run: |
          rm -f .github/workflows/localize-seo-photos-batch9.yml
          git config user.name "ChatGPT Site Editor"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add specific lawn care photos"
          git push
