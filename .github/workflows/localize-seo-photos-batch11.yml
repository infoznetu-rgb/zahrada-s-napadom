name: Localize SEO photos batch 11
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localize-seo-photos-batch11.yml'
permissions:
  contents: write
jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download vegetable support photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/blog/seo-specific
          curl -L --fail --retry 3 'https://images.pexels.com/photos/36610017/pexels-photo-36610017.jpeg?auto=compress&cs=tinysrgb&w=1280&h=720&fit=crop' -o assets/blog/seo-specific/opora-paradajok.jpg
          curl -L --fail --retry 3 'https://images.pexels.com/photos/7299975/pexels-photo-7299975.jpeg?auto=compress&cs=tinysrgb&w=1280&h=720&fit=crop' -o assets/blog/seo-specific/zalistky-paradajok.jpg
          curl -L --fail --retry 3 'https://images.pexels.com/photos/37270950/pexels-photo-37270950.jpeg?auto=compress&cs=tinysrgb&w=1280&h=720&fit=crop' -o assets/blog/seo-specific/fazula.jpg
          curl -L --fail --retry 3 'https://images.pexels.com/photos/4750266/pexels-photo-4750266.jpeg?auto=compress&cs=tinysrgb&w=1280&h=720&fit=crop' -o assets/blog/seo-specific/hrach.jpg
      - name: Update article image references
        shell: python
        run: |
          import json,re
          from pathlib import Path
          items={
            "vyvazovanie-paradajok-opora":"/assets/blog/seo-specific/opora-paradajok.jpg",
            "vylamovanie-zalistkov-paradajok":"/assets/blog/seo-specific/zalistky-paradajok.jpg",
            "fazula-tyckova-opora-vysev":"/assets/blog/seo-specific/fazula.jpg",
            "hrach-opora-vysev":"/assets/blog/seo-specific/hrach.jpg",
          }
          for slug,new in items.items():
            p=Path("blog")/slug/"index.html"
            s=p.read_text()
            s=re.sub(r'(<meta property="og:image" content=")[^"]+(")',lambda m:m.group(1)+"https://zahradasnapadom.sk"+new+m.group(2),s)
            s=re.sub(r'(<meta name="twitter:image" content=")[^"]+(")',lambda m:m.group(1)+"https://zahradasnapadom.sk"+new+m.group(2),s)
            s=re.sub(r'("image":\["https://zahradasnapadom\.sk)[^"]+("\])',lambda m:m.group(1)+new+m.group(2),s)
            s=re.sub(r'(<figure class="post-hero"><img src=")[^"]+(")',lambda m:m.group(1)+new+m.group(2),s)
            s=re.sub(r'("cover_url":\s*")[^"]+(")',lambda m:m.group(1)+new+m.group(2),s)
            p.write_text(s)
          j=Path("data/seo-blog-100-list.json")
          data=json.loads(j.read_text())
          for row in data:
            if row.get("slug") in items:
              row["cover_url"]=items[row["slug"]]
          j.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n")
      - name: Commit local vegetable photos
        shell: bash
        run: |
          rm -f .github/workflows/localize-seo-photos-batch11.yml
          git config user.name "ChatGPT Site Editor"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add specific photos for tomato supports beans peas"
          git push
