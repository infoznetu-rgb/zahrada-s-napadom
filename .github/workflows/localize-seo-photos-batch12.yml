name: Localize SEO photos batch 12
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localize-seo-photos-batch12.yml'
permissions:
  contents: write
jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download root vegetable photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/blog/seo-specific
          curl -L --fail --retry 3 'https://images.pexels.com/photos/8131636/pexels-photo-8131636.jpeg?auto=compress&cs=tinysrgb&w=1280&h=720&fit=crop' -o assets/blog/seo-specific/cibula.jpg
          curl -L --fail --retry 3 'https://images.pexels.com/photos/6502330/pexels-photo-6502330.jpeg?auto=compress&cs=tinysrgb&w=1280&h=720&fit=crop' -o assets/blog/seo-specific/mrkva.jpg
          curl -L --fail --retry 3 'https://images.pexels.com/photos/15670720/pexels-photo-15670720.jpeg?auto=compress&cs=tinysrgb&w=1280&h=720&fit=crop' -o assets/blog/seo-specific/redkovka.jpg
          curl -L --fail --retry 3 'https://images.pexels.com/photos/12191414/pexels-photo-12191414.jpeg?auto=compress&cs=tinysrgb&w=1280&h=720&fit=crop' -o assets/blog/seo-specific/zemiaky.jpg
      - name: Update article image references
        shell: python
        run: |
          import json,re
          from pathlib import Path
          items={
            "cibula-zo-sadzacky":"/assets/blog/seo-specific/cibula.jpg",
            "mrkva-rovne-korene-priprava-pody":"/assets/blog/seo-specific/mrkva.jpg",
            "redkovka-pestovanie-bez-vybiehania":"/assets/blog/seo-specific/redkovka.jpg",
            "zemiaky-v-malej-zahrade":"/assets/blog/seo-specific/zemiaky.jpg",
          }
          for slug,new in items.items():
            p=Path("blog")/slug/"index.html"
            s=p.read_text()
            s=re.sub(r'(<meta property="og:image" content=")[^"]+(")',lambda m:m.group(1)+"https://zahradasnapadom.sk"+new+m.group(2),s)
            s=re.sub(r'(<meta name="twitter:image" content=")[^"]+(")',lambda m:m.group(1)+"https://zahradasnapadom.sk"+new+m.group(2),s)
            s=re.sub(r'("image":\["https://zahradasnapadom\.sk)[^"]+("\])',lambda m:m.group(1)+new+m.group(2),s)
            s=re.sub(r'(<figure class="post-hero"><img src=")[^"]+(")',lambda m:m.group(1)+new+m.group(2),s)
            s=re.sub(r'("cover_url":\s*")[^"]+(")',lambda m:m.group(1)+new+m.group(2),s)
            p.write_text(s)
          j=Path("data/seo-blog-100-list.json")
          data=json.loads(j.read_text())
          for row in data:
            if row.get("slug") in items:
              row["cover_url"]=items[row["slug"]]
          j.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n")
      - name: Commit local root vegetable photos
        shell: bash
        run: |
          rm -f .github/workflows/localize-seo-photos-batch12.yml
          git config user.name "ChatGPT Site Editor"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add specific photos for onion carrot radish potatoes"
          git push
