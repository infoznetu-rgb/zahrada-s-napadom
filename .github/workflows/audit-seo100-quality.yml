name: Audit SEO100 quality
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-seo100-quality.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit all 100 SEO articles
        shell: python
        run: |
          import json,re
          from pathlib import Path
          rows=json.loads(Path("data/seo-blog-100-list.json").read_text())
          report=[]
          for row in rows:
            slug=row["slug"]
            p=Path("blog")/slug/"index.html"
            s=p.read_text() if p.exists() else ""
            checks={
              "exists":p.exists(),
              "title":bool(re.search(r"<title>[^<]{10,}</title>",s,re.I)),
              "meta_description":bool(re.search(r'<meta name="description" content="[^"]{50,}"',s,re.I)),
              "canonical":f"https://zahradasnapadom.sk/blog/{slug}/" in s,
              "h1":bool(re.search(r"<h1[^>]*>[^<]+</h1>",s,re.I)),
              "hero":'class="post-hero"' in s,
              "no_seo_svg":"/assets/blog/seo100/" not in s,
              "faq_visible":'class="article-faq"' in s or "Najčastejšie otázky" in s,
              "related_links":'class="related-links"' in s,
              "cluster_link":"/temy/" in (re.search(r'<div class="related-links">([\s\S]*?)</div>',s,re.I).group(1) if re.search(r'<div class="related-links">([\s\S]*?)</div>',s,re.I) else ""),
              "article_schema":'"@type":"Article"' in s or '"@type": "Article"' in s,
            }
            missing=[k for k,v in checks.items() if not v]
            report.append({"slug":slug,"title":row.get("title"),"category":row.get("category"),"checks":checks,"missing":missing})
          summary={
            "total":len(report),
            "passing":sum(not r["missing"] for r in report),
            "failing":sum(bool(r["missing"]) for r in report),
            "missing_counts":{}
          }
          for r in report:
            for key in r["missing"]:
              summary["missing_counts"][key]=summary["missing_counts"].get(key,0)+1
          out={"summary":summary,"articles":report}
          Path("data/seo-blog-100-quality-report.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(summary,ensure_ascii=False,indent=2))
      - name: Commit quality report
        shell: bash
        run: |
          rm -f .github/workflows/audit-seo100-quality.yml
          git config user.name "ChatGPT SEO Auditor"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Audit quality of 100 SEO articles"
          git push
