name: Localize SEO photos batch 7
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localize-seo-photos-batch7.yml'
permissions:
  contents: write
jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download ornamental photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/blog/seo-specific
          curl -L --fail --retry 3 'https://images.pexels.com/photos/33341878/pexels-photo-33341878.jpeg?auto=compress&cs=tinysrgb&w=1280&h=720&fit=crop' -o assets/blog/seo-specific/tulipany.jpg
          curl -L --fail --retry 3 'https://images.pexels.com/photos/20517664/pexels-photo-20517664.jpeg?auto=compress&cs=tinysrgb&w=1280&h=720&fit=crop' -o assets/blog/seo-specific/narcisy.jpg
          curl -L --fail --retry 3 'https://images.pexels.com/photos/22064356/pexels-photo-22064356.jpeg?auto=compress&cs=tinysrgb&w=1280&h=720&fit=crop' -o assets/blog/seo-specific/hosty.jpg
          curl -L --fail --retry 3 'https://images.pexels.com/photos/17277515/pexels-photo-17277515.jpeg?auto=compress&cs=tinysrgb&w=1280&h=720&fit=crop' -o assets/blog/seo-specific/muskaty.jpg
      - name: Update article image references
        shell: python
        run: |
          import json,re
          from pathlib import Path
          items={
            "tulipany-po-odkvitnuti":"/assets/blog/seo-specific/tulipany.jpg",
            "narcisy-po-odkvitnuti":"/assets/blog/seo-specific/narcisy.jpg",
            "hosty-v-tieni-pestovanie":"/assets/blog/seo-specific/hosty.jpg",
            "muskaty-prezimovanie":"/assets/blog/seo-specific/muskaty.jpg",
          }
          for slug,new in items.items():
            p=Path("blog")/slug/"index.html"
            s=p.read_text()
            s=re.sub(r'(<meta property="og:image" content=")[^"]+(")',lambda m:m.group(1)+"https://zahradasnapadom.sk"+new+m.group(2),s)
            s=re.sub(r'(<meta name="twitter:image" content=")[^"]+(")',lambda m:m.group(1)+"https://zahradasnapadom.sk"+new+m.group(2),s)
            s=re.sub(r'("image":\["https://zahradasnapadom\.sk)[^"]+("\])',lambda m:m.group(1)+new+m.group(2),s)
            s=re.sub(r'(<figure class="post-hero"><img src=")[^"]+(")',lambda m:m.group(1)+new+m.group(2),s)
            s=re.sub(r'("cover_url":\s*")[^"]+(")',lambda m:m.group(1)+new+m.group(2),s)
            p.write_text(s)
          j=Path("data/seo-blog-100-list.json")
          data=json.loads(j.read_text())
          for row in data:
            if row.get("slug") in items:
              row["cover_url"]=items[row["slug"]]
          j.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n")
      - name: Commit local ornamental photos
        shell: bash
        run: |
          rm -f .github/workflows/localize-seo-photos-batch7.yml
          git config user.name "ChatGPT Site Editor"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add specific photos for tulips daffodils hostas geraniums"
          git push
