name: Localize SEO photos batch 2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localize-seo-photos-batch2.yml'
permissions:
  contents: write
jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download topic photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/blog/seo-specific
          curl -L --fail --retry 3 'https://images.pexels.com/photos/27950665/pexels-photo-27950665.jpeg?auto=compress&cs=tinysrgb&w=1280&h=720&fit=crop' -o assets/blog/seo-specific/strihanie-hortenzii.jpg
          curl -L --fail --retry 3 'https://images.pexels.com/photos/8279818/pexels-photo-8279818.jpeg?auto=compress&cs=tinysrgb&w=1280&h=720&fit=crop' -o assets/blog/seo-specific/pivonie-vysadba.jpg
          curl -L --fail --retry 3 'https://images.pexels.com/photos/33647744/pexels-photo-33647744.jpeg?auto=compress&cs=tinysrgb&w=1280&h=720&fit=crop' -o assets/blog/seo-specific/cucoriedky.jpg
          curl -L --fail --retry 3 'https://images.pexels.com/photos/7729129/pexels-photo-7729129.jpeg?auto=compress&cs=tinysrgb&w=1280&h=720&fit=crop' -o assets/blog/seo-specific/novy-travnik.jpg
      - name: Update article image references
        shell: python
        run: |
          import json,re
          from pathlib import Path
          items={
            "strihanie-hortenzii-podla-druhu":"/assets/blog/seo-specific/strihanie-hortenzii.jpg",
            "pivonie-spravna-vysadba":"/assets/blog/seo-specific/pivonie-vysadba.jpg",
            "cucoriedky-kysla-poda-pestovanie":"/assets/blog/seo-specific/cucoriedky.jpg",
            "novy-travnik-zo-semena":"/assets/blog/seo-specific/novy-travnik.jpg",
          }
          for slug,new in items.items():
            p=Path("blog")/slug/"index.html"
            s=p.read_text()
            s=re.sub(r'(<meta property="og:image" content=")[^"]+(")',lambda m:m.group(1)+"https://zahradasnapadom.sk"+new+m.group(2),s)
            s=re.sub(r'(<meta name="twitter:image" content=")[^"]+(")',lambda m:m.group(1)+"https://zahradasnapadom.sk"+new+m.group(2),s)
            s=re.sub(r'("image":\["https://zahradasnapadom\.sk)[^"]+("\])',lambda m:m.group(1)+new+m.group(2),s)
            s=re.sub(r'(<figure class="post-hero"><img src=")[^"]+(")',lambda m:m.group(1)+new+m.group(2),s)
            s=re.sub(r'("cover_url":\s*")[^"]+(")',lambda m:m.group(1)+new+m.group(2),s)
            p.write_text(s)
          j=Path("data/seo-blog-100-list.json")
          data=json.loads(j.read_text())
          for row in data:
            if row.get("slug") in items:
              row["cover_url"]=items[row["slug"]]
          j.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n")
      - name: Commit local topic photos
        shell: bash
        run: |
          rm -f .github/workflows/localize-seo-photos-batch2.yml
          git config user.name "ChatGPT Site Editor"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add specific photos for key SEO articles"
          git push
