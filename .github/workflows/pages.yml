name: Deploy Záhrada s nápadom

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify search engines through IndexNow
        env:
          INDEXNOW_KEY: 2bfa5ccde4a6649e558bc73b00b03636
        run: |
          URLS=$(grep -oP '(?<=<loc>)[^<]+' sitemap.xml | jq -R . | jq -s .)
          jq -n \
            --arg host "zahradasnapadom.sk" \
            --arg key "$INDEXNOW_KEY" \
            --arg keyLocation "https://zahradasnapadom.sk/$INDEXNOW_KEY.txt" \
            --argjson urlList "$URLS" \
            '{host:$host,key:$key,keyLocation:$keyLocation,urlList:$urlList}' \
            > indexnow-payload.json
          curl --fail-with-body --retry 3 \
            -H "Content-Type: application/json; charset=utf-8" \
            --data-binary @indexnow-payload.json \
            https://api.indexnow.org/indexnow
