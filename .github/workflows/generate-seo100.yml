name: Generate SEO100 blogs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-seo100.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild generator
        shell: bash
        run: |
          cat .seo100/generator.part1 .seo100/generator.part2 .seo100/generator.part3 > /tmp/generator.b64
          python - <<'PY'
          import base64,gzip
          from pathlib import Path
          payload=Path('/tmp/generator.b64').read_text().strip()
          Path('/tmp/generate_seo100.py').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
      - name: Generate 100 blogs
        run: python /tmp/generate_seo100.py
      - name: Commit generated site
        shell: bash
        run: |
          rm -f .github/workflows/generate-seo100.yml
          rm -rf .seo100
          git config user.name "ChatGPT SEO Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add 100 SEO blog articles and scalable blog archive"
          git push
