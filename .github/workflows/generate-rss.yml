name: Generate RSS feed
on:
  push:
    branches: [main]
    paths:
      - 'blog/**'
      - 'generate-rss.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate feed
        run: python3 generate-rss.py
      - name: Commit updated feed
        run: |
          if ! git diff --quiet -- rss.xml || [ ! -f rss.xml ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rss.xml
            git diff --cached --quiet || (git commit -m "Update RSS feed" && git push)
          fi
