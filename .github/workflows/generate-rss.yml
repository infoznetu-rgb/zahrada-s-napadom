name: Generate RSS feed
on:
  push:
    branches: [main]
    paths:
      - 'blog/**'
      - 'generate-rss.py'
      - 'scripts/generate-facebook-images.py'
      - '.github/workflows/generate-rss.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Pillow
        run: python3 -m pip install --quiet Pillow
      - name: Generate Facebook JPEGs and feed
        run: |
          python3 scripts/generate-facebook-images.py
          python3 generate-rss.py
      - name: Commit updated feed
        run: |
          if [ -n "$(git status --porcelain -- rss.xml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rss.xml
            git diff --cached --quiet || (git commit -m "Update RSS feed" && git push)
          fi
