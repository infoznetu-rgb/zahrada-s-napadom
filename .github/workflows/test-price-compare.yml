name: Test product price comparison
on:
  push:
    paths:
      - '.github/workflows/test-price-compare.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Bing indexed Heureka snippets
        shell: bash
        run: |
          set -euo pipefail
          Q='site%3Aheureka.sk%20%22dreveny%20kvetinac%22%20%22%E2%82%AC%22'
          curl --fail --silent --show-error -A 'Mozilla/5.0'             "https://www.bing.com/search?cc=sk&setlang=sk&count=30&q=$Q"             -o bing.html
          python - <<'PY'
          import re, html
          s=open('bing.html',encoding='utf-8',errors='ignore').read()
          print('bytes=',len(s),'b_algo=',len(re.findall(r'b_algo',s)))
          for pat in ['€','&euro;','46,90','79,90','heureka.sk','kvetináč','kvetinac']:
              inds=[m.start() for m in re.finditer(re.escape(pat),s,re.I)]
              print('PATTERN',pat,'COUNT',len(inds))
              for i in inds[:5]:
                  print(html.unescape(re.sub(r'\s+',' ',s[max(0,i-350):i+700]))[:1050])
          PY
