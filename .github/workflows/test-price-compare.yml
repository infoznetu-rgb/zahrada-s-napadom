name: Test product price comparison
on:
  push:
    paths:
      - '.github/workflows/test-price-compare.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Bing search HTML
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -A 'Mozilla/5.0'             'https://www.bing.com/search?cc=sk&setlang=sk&count=20&q=dreveny%20kvetinac%20cena'             -o bing.html
          python - <<'PY'
          import re, html
          s=open('bing.html',encoding='utf-8',errors='ignore').read()
          print('bytes=',len(s))
          print('b_algo=',len(re.findall(r'b_algo',s)))
          for pat in ['€','&euro;','EUR','Price','price','Kvetin','kvetin']:
              inds=[m.start() for m in re.finditer(re.escape(pat),s,re.I)]
              print('PATTERN',pat,'COUNT',len(inds))
              for i in inds[:3]:
                  print(html.unescape(re.sub(r'\s+',' ',s[max(0,i-300):i+600]))[:950])
          PY
