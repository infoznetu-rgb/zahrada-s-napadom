name: Test product price comparison
on:
  push:
    paths:
      - '.github/workflows/test-price-compare.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public reader output
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             'https://r.jina.ai/https://www.heureka.sk/?h%5Bfraze%5D=dreveny%20kvetinac'             -o reader.txt
          python - <<'PY'
          s=open('reader.txt',encoding='utf-8',errors='ignore').read()
          print('bytes=',len(s))
          for pat in ['ROJAPLAST','46,90','79,90','€','Drevený kvetináč']:
              i=s.find(pat)
              print('PATTERN',pat,'INDEX',i)
              if i>=0: print(s[max(0,i-250):i+700].replace('\n',' ')[:950])
          PY
