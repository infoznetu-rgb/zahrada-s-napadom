name: Test product price comparison
on:
  push:
    paths:
      - '.github/workflows/test-price-compare.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call price comparison function
        shell: bash
        run: |
          set -euo pipefail
          KEY=$(python - <<'PY'
          import re
          s=open('cms-public.js',encoding='utf-8').read()
          m=re.search(r'CMS_KEY="([^"]+)"',s)
          assert m
          print(m.group(1))
          PY
          )
          URL='https://bkyappgttwjxakkwycub.supabase.co/functions/v1/product-price-compare'
          curl --fail --silent --show-error --get "$URL"             -H "apikey: $KEY"             -H "Authorization: Bearer $KEY"             --data-urlencode 'q=dreveny kvetinac'             -o response.json
          python - <<'PY'
          import json
          d=json.load(open('response.json'))
          assert d.get('query') == 'dreveny kvetinac', d
          assert isinstance(d.get('results'), list), d
          assert isinstance(d.get('stats'), dict), d
          print('provider=', d.get('provider'))
          print('results=', len(d.get('results', [])))
          print('stats=', d.get('stats'))
          for x in d.get('results', [])[:5]:
              print(x.get('price'), x.get('match'), x.get('domain'), x.get('title'))
          PY
