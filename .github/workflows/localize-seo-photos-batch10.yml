name: Localize SEO photos batch 10
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localize-seo-photos-batch10.yml'
permissions:
  contents: write
jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download home and garden photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/blog/seo-specific
          curl -L --fail --retry 3 'https://images.pexels.com/photos/17595605/pexels-photo-17595605.jpeg?auto=compress&cs=tinysrgb&w=1280&h=720&fit=crop' -o assets/blog/seo-specific/strkovy-chodnik.jpg
          curl -L --fail --retry 3 'https://images.pexels.com/photos/33597255/pexels-photo-33597255.jpeg?auto=compress&cs=tinysrgb&w=1280&h=720&fit=crop' -o assets/blog/seo-specific/pergola.jpg
          curl -L --fail --retry 3 'https://images.pexels.com/photos/4946627/pexels-photo-4946627.jpeg?auto=compress&cs=tinysrgb&w=1280&h=720&fit=crop' -o assets/blog/seo-specific/sklenik.jpg
          curl -L --fail --retry 3 'https://images.pexels.com/photos/36940916/pexels-photo-36940916.jpeg?auto=compress&cs=tinysrgb&w=1280&h=720&fit=crop' -o assets/blog/seo-specific/zahradne-osvetlenie.jpg
      - name: Update article image references
        shell: python
        run: |
          import json,re
          from pathlib import Path
          items={
            "strkovy-chodnik-vrstvy":"/assets/blog/seo-specific/strkovy-chodnik.jpg",
            "pergola-pri-dome-planovanie":"/assets/blog/seo-specific/pergola.jpg",
            "maly-sklenik-zaklady-kotvenie":"/assets/blog/seo-specific/sklenik.jpg",
            "zahradne-osvetlenie-bezpecnost":"/assets/blog/seo-specific/zahradne-osvetlenie.jpg",
          }
          for slug,new in items.items():
            p=Path("blog")/slug/"index.html"
            s=p.read_text()
            s=re.sub(r'(<meta property="og:image" content=")[^"]+(")',lambda m:m.group(1)+"https://zahradasnapadom.sk"+new+m.group(2),s)
            s=re.sub(r'(<meta name="twitter:image" content=")[^"]+(")',lambda m:m.group(1)+"https://zahradasnapadom.sk"+new+m.group(2),s)
            s=re.sub(r'("image":\["https://zahradasnapadom\.sk)[^"]+("\])',lambda m:m.group(1)+new+m.group(2),s)
            s=re.sub(r'(<figure class="post-hero"><img src=")[^"]+(")',lambda m:m.group(1)+new+m.group(2),s)
            s=re.sub(r'("cover_url":\s*")[^"]+(")',lambda m:m.group(1)+new+m.group(2),s)
            p.write_text(s)
          j=Path("data/seo-blog-100-list.json")
          data=json.loads(j.read_text())
          for row in data:
            if row.get("slug") in items:
              row["cover_url"]=items[row["slug"]]
          j.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n")
      - name: Commit local home and garden photos
        shell: bash
        run: |
          rm -f .github/workflows/localize-seo-photos-batch10.yml
          git config user.name "ChatGPT Site Editor"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add specific photos for paths pergola greenhouse lighting"
          git push
