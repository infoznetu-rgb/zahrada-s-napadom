name: Localize SEO photos batch 6
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localize-seo-photos-batch6.yml'
permissions:
  contents: write
jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download fruit tree photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/blog/seo-specific
          curl -L --fail --retry 3 'https://images.pexels.com/photos/46541/currant-immature-mature-bush-46541.jpeg?auto=compress&cs=tinysrgb&w=1280&h=720&fit=crop' -o assets/blog/seo-specific/egrese.jpg
          curl -L --fail --retry 3 'https://images.pexels.com/photos/33835690/pexels-photo-33835690.jpeg?auto=compress&cs=tinysrgb&w=1280&h=720&fit=crop' -o assets/blog/seo-specific/slivka.jpg
          curl -L --fail --retry 3 'https://images.pexels.com/photos/8893446/pexels-photo-8893446.jpeg?auto=compress&cs=tinysrgb&w=1280&h=720&fit=crop' -o assets/blog/seo-specific/ceresna.jpg
          curl -L --fail --retry 3 'https://images.pexels.com/photos/37066325/pexels-photo-37066325.jpeg?auto=compress&cs=tinysrgb&w=1280&h=720&fit=crop' -o assets/blog/seo-specific/mlady-strom-zima.jpg
      - name: Update article image references
        shell: python
        run: |
          import json,re
          from pathlib import Path
          items={
            "egrese-rez-kra":"/assets/blog/seo-specific/egrese.jpg",
            "slivka-kedy-strihat":"/assets/blog/seo-specific/slivka.jpg",
            "ceresna-rez-po-zbere":"/assets/blog/seo-specific/ceresna.jpg",
            "mlade-ovocne-stromy-pred-zimou":"/assets/blog/seo-specific/mlady-strom-zima.jpg",
          }
          for slug,new in items.items():
            p=Path("blog")/slug/"index.html"
            s=p.read_text()
            s=re.sub(r'(<meta property="og:image" content=")[^"]+(")',lambda m:m.group(1)+"https://zahradasnapadom.sk"+new+m.group(2),s)
            s=re.sub(r'(<meta name="twitter:image" content=")[^"]+(")',lambda m:m.group(1)+"https://zahradasnapadom.sk"+new+m.group(2),s)
            s=re.sub(r'("image":\["https://zahradasnapadom\.sk)[^"]+("\])',lambda m:m.group(1)+new+m.group(2),s)
            s=re.sub(r'(<figure class="post-hero"><img src=")[^"]+(")',lambda m:m.group(1)+new+m.group(2),s)
            s=re.sub(r'("cover_url":\s*")[^"]+(")',lambda m:m.group(1)+new+m.group(2),s)
            p.write_text(s)
          j=Path("data/seo-blog-100-list.json")
          data=json.loads(j.read_text())
          for row in data:
            if row.get("slug") in items:
              row["cover_url"]=items[row["slug"]]
          j.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n")
      - name: Commit local fruit photos
        shell: bash
        run: |
          rm -f .github/workflows/localize-seo-photos-batch6.yml
          git config user.name "ChatGPT Site Editor"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add specific photos for gooseberry plum cherry young trees"
          git push
