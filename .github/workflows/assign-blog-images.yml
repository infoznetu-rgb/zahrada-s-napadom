name: Fix unique blog hero images
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assign-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Match existing images to article slugs
        run: python3 scripts/assign-blog-images.py
      - name: Commit changed articles and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog data/blog-image-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Assign distinct existing images to matching blog articles"
            git push
          fi
